<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="스피치 스튜디오">
<meta name="theme-color" content="#14171C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<title>스피치 스튜디오</title>
<style>
  :root{
    --bg: #14171C;
    --surface: #1E232B;
    --surface-2: #262C36;
    --text: #F2F1ED;
    --text-muted: #8A8F98;
    --onair: #FF4757;
    --ring-bg: #2C333E;

    --c1: #4FA3F7; /* 키워드 조합 */
    --c2: #3DD6C0; /* 주제 연상 */
    --c3: #F5A623; /* 단어 설명 */
    --c4: #FF6B5B; /* 주식시황 */
    --c5: #9B8CFF; /* 랜덤 시사 */

    --sans: -apple-system, "SF Pro Text", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    --mono: ui-monospace, "SF Mono", "Menlo", monospace;
    --ease: cubic-bezier(0.22,1,0.36,1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overscroll-behavior: none;
    -webkit-user-select:none; user-select:none;
  }

  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    display:flex; flex-direction:column;
    min-height:100vh;
  }

  .container { max-width: 560px; width:100%; margin:0 auto; flex:1; display:flex; flex-direction:column; position:relative; }

  .screen { display:none; flex-direction:column; flex:1; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); animation: fadein .35s var(--ease); }
  .screen.active { display:flex; }
  @keyframes fadein { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  body.reduced-motion .screen { animation:none; }
  body.reduced-motion * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }

  /* ---------- Main menu ---------- */
  .home-header { padding: 12px 4px 22px; }
  .home-title { font-size: clamp(24px,6vw,30px); font-weight:700; letter-spacing:-0.02em; margin:0 0 6px; }
  .home-stats { color: var(--text-muted); font-size:14px; display:flex; gap:14px; }
  .home-stats b { color: var(--text); font-weight:600; }

  .game-list { display:flex; flex-direction:column; gap:12px; }

  .game-btn {
    display:flex; align-items:center; gap:14px;
    background: var(--surface);
    border: none; border-left: 4px solid var(--accent, var(--c1));
    border-radius: 14px;
    padding: 16px 16px;
    text-align:left;
    color: var(--text);
    cursor:pointer;
    transition: transform .15s var(--ease), background .15s var(--ease);
  }
  .game-btn:active { transform: scale(0.97); background: var(--surface-2); }
  .game-btn:focus-visible { outline: 2px solid var(--accent, var(--c1)); outline-offset: 2px; }

  .game-btn .icon {
    width:46px; height:46px; border-radius:12px;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .game-btn .meta { flex:1; min-width:0; }
  .game-btn .meta .t { font-size:16px; font-weight:600; margin-bottom:2px; }
  .game-btn .meta .s { font-size:13px; color: var(--text-muted); }
  .game-btn .fmt { font-size:12px; color: var(--accent); font-family: var(--mono); white-space:nowrap; }

  .home-footnote { margin-top:20px; text-align:center; color: var(--text-muted); font-size:12px; line-height:1.6; }

  /* ---------- Game intro ---------- */
  .intro-screen { align-items:center; justify-content:center; text-align:center; gap: 14px; }
  .intro-icon { width:88px; height:88px; border-radius:22px; display:flex; align-items:center; justify-content:center; font-size:40px; background: color-mix(in srgb, var(--accent) 20%, transparent); animation: popin .5s var(--ease); }
  @keyframes popin { from{opacity:0; transform:scale(0.7);} to{opacity:1; transform:scale(1);} }
  .intro-eyebrow { color: var(--accent); font-size:13px; font-weight:600; }
  .intro-title { font-size:24px; font-weight:700; margin:0; }
  .intro-desc { color: var(--text-muted); font-size:14px; max-width:320px; line-height:1.5; }
  .intro-fmt { font-family: var(--mono); font-size:13px; color: var(--text); background: var(--surface); padding:6px 12px; border-radius:100px; }
  .intro-progress { width:120px; height:3px; background: var(--ring-bg); border-radius:3px; overflow:hidden; margin-top:8px; }
  .intro-progress i { display:block; height:100%; background: var(--accent); width:0%; transition: width linear; }

  /* ---------- Round screen ---------- */
  .round-screen { align-items:center; justify-content:space-between; }
  .round-top { width:100%; display:flex; align-items:center; justify-content:space-between; padding-top:4px; }
  .round-dots { display:flex; gap:6px; }
  .round-dots span { width:6px; height:6px; border-radius:50%; background: var(--ring-bg); }
  .round-dots span.done { background: var(--accent); }
  .round-dots span.now { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }

  .prompt-block { text-align:center; padding: 10px 8px; }
  .prompt-label { color: var(--text-muted); font-size:13px; margin-bottom:10px; }
  .prompt-main { font-size: clamp(22px,7vw,30px); font-weight:700; line-height:1.35; }
  .prompt-main.words { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .prompt-main .chip { background: var(--surface); border:1px solid var(--ring-bg); padding:8px 16px; border-radius:100px; font-size: clamp(16px,5vw,20px); }

  .timer-wrap { position:relative; width: min(58vw, 240px); height: min(58vw, 240px); display:flex; align-items:center; justify-content:center; margin: 6px 0; }
  .timer-wrap svg { width:100%; height:100%; transform:rotate(-90deg); }
  .timer-wrap circle { fill:none; stroke-width:10; }
  .ring-bg { stroke: var(--ring-bg); }
  .ring-fg { stroke: var(--accent); stroke-linecap:round; transition: stroke-dashoffset 0.18s linear, stroke .3s; }
  .timer-num { position:absolute; font-family: var(--mono); font-size: clamp(40px,13vw,58px); font-weight:600; font-variant-numeric: tabular-nums; }
  .timer-sub { position:absolute; bottom: 18%; font-size:12px; color: var(--text-muted); }

  .onair-pill { display:inline-flex; align-items:center; gap:6px; background: color-mix(in srgb, var(--onair) 16%, transparent); color: var(--onair); font-size:12px; font-weight:600; padding:5px 12px; border-radius:100px; }
  .onair-dot { width:7px; height:7px; border-radius:50%; background: var(--onair); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .prep-pill { display:inline-flex; align-items:center; gap:6px; background: var(--surface); color: var(--text-muted); font-size:12px; font-weight:600; padding:5px 12px; border-radius:100px; }

  .round-bottom { width:100%; display:flex; justify-content:center; }
  .skip-btn { background:none; border:none; color: var(--text-muted); font-size:13px; padding:10px 16px; cursor:pointer; }
  .skip-btn:active { color: var(--text); }

  /* ---------- Transition toast ---------- */
  .transition-screen { align-items:center; justify-content:center; text-align:center; gap:10px; }
  .transition-check { width:56px; height:56px; border-radius:50%; background: color-mix(in srgb, var(--accent) 18%, transparent); display:flex; align-items:center; justify-content:center; font-size:26px; animation: popin .4s var(--ease); color: var(--accent); }
  .transition-msg { font-size:16px; font-weight:600; }
  .transition-sub { color: var(--text-muted); font-size:13px; }

  /* ---------- Complete screen ---------- */
  .complete-screen { align-items:center; justify-content:center; text-align:center; gap:16px; }
  .complete-badge { font-size:46px; }
  .complete-title { font-size:24px; font-weight:700; margin:0; }
  .complete-stats { display:flex; gap:22px; margin: 6px 0 4px; }
  .complete-stat b { display:block; font-size:22px; font-family: var(--mono); }
  .complete-stat span { display:block; font-size:12px; color: var(--text-muted); margin-top:2px; }
  .complete-games { display:flex; gap:8px; }
  .complete-games .g { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; background: var(--surface); }
  .home-btn { margin-top: 14px; background: var(--text); color: var(--bg); border:none; padding:14px 32px; border-radius:100px; font-size:15px; font-weight:600; cursor:pointer; }
  .home-btn:active { opacity:.8; }

  /* ---------- Exit ---------- */
  .exit-btn { position:fixed; top: calc(14px + env(safe-area-inset-top)); left:14px; width:34px; height:34px; border-radius:50%; background: var(--surface); border:none; color: var(--text-muted); font-size:16px; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:50; }
  .exit-btn.show { display:flex; }
</style>
</head>
<body>
<div class="container">

  <button class="exit-btn" id="exitBtn" aria-label="종료">✕</button>

  <!-- Main menu -->
  <div class="screen active" id="screen-home">
    <div class="home-header">
      <h1 class="home-title">스피치 스튜디오</h1>
      <div class="home-stats" id="homeStats"></div>
    </div>
    <div class="game-list" id="gameList"></div>
    <div class="home-footnote">게임을 선택하면 그 게임부터 5번까지 이어서 진행돼요</div>
  </div>

  <!-- Game intro -->
  <div class="screen intro-screen" id="screen-intro">
    <span class="intro-eyebrow" id="introEyebrow"></span>
    <div class="intro-icon" id="introIcon"></div>
    <h2 class="intro-title" id="introTitle"></h2>
    <p class="intro-desc" id="introDesc"></p>
    <span class="intro-fmt" id="introFmt"></span>
    <div class="intro-progress"><i id="introProgressBar"></i></div>
  </div>

  <!-- Round screen -->
  <div class="screen round-screen" id="screen-round">
    <div class="round-top">
      <div class="round-dots" id="roundDots"></div>
      <div id="statePill"></div>
    </div>
    <div class="prompt-block">
      <div class="prompt-label" id="promptLabel"></div>
      <div class="prompt-main" id="promptMain"></div>
    </div>
    <div class="timer-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="88"></circle>
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"></circle>
      </svg>
      <div class="timer-num" id="timerNum">0</div>
      <div class="timer-sub" id="timerSub"></div>
    </div>
    <div class="round-bottom">
      <button class="skip-btn" id="skipBtn">다음으로 건너뛰기</button>
    </div>
  </div>

  <!-- Transition toast -->
  <div class="screen transition-screen" id="screen-transition">
    <div class="transition-check">✓</div>
    <div class="transition-msg" id="transitionMsg"></div>
    <div class="transition-sub" id="transitionSub"></div>
  </div>

  <!-- Complete -->
  <div class="screen complete-screen" id="screen-complete">
    <div class="complete-badge">🎉</div>
    <h2 class="complete-title">오늘의 트레이닝 완료!</h2>
    <div class="complete-games" id="completeGames"></div>
    <div class="complete-stats" id="completeStats"></div>
    <button class="home-btn" id="homeBtn">홈으로</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.body.classList.add('reduced-motion');
  }

  /* ---------------- content pools ---------------- */
  const KEYWORDS = ["우산","커피","자전거","시계","바다","편지","음악","별","강아지","카메라",
    "지도","열쇠","나무","신발","창문","라디오","향수","지갑","안경","계단",
    "우체통","조명","담요","접시","시장","다리","정원","기차","노트북","텐트",
    "그림","악기","냉장고","여권","배낭","선물","엘리베이터","신문","자물쇠","분수"];

  const TOPICS = ["여행","행복","우정","성공과 실패","사랑","가족","미래","환경","건강","돈",
    "시간 관리","꿈","도전","변화","좋은 습관","자유","신뢰","창의성","리더십","휴식"];

  const OBJECTS = ["텀블러","우산","신발끈","자전거","냉장고","전자레인지","손목시계","안경","지갑","이어폰",
    "배낭","여권","계산기","다리미","선풍기","정수기","우체통","리모컨","캐리어","보조배터리"];

  const QA_QUESTIONS = [
    "최근 가장 인상 깊었던 국제 뉴스는 무엇인가요?",
    "인공지능이 일자리에 미치는 영향에 대해 어떻게 생각하나요?",
    "최근 본 영화나 드라마 중 추천하고 싶은 작품은?",
    "기후변화 대응을 위해 개인이 할 수 있는 일은 무엇일까요?",
    "요즘 가장 관심 있는 사회 이슈는 무엇인가요?",
    "좋아하는 예술가나 뮤지션에 대해 이야기해보세요",
    "최근 경제 뉴스 중 기억에 남는 것은 무엇인가요?",
    "전통문화와 현대문화의 조화에 대해 어떻게 생각하나요?",
    "요즘 화제가 되고 있는 정치 이슈에 대한 생각은?",
    "K-콘텐츠가 세계적으로 인기 있는 이유는 무엇일까요?",
    "인상 깊게 읽은 책이나 기사에 대해 말해보세요",
    "일과 삶의 균형에 대해 어떻게 생각하나요?",
    "최근 관심 가는 스포츠 소식이 있나요?",
    "SNS가 사회에 미치는 영향에 대해 이야기해보세요",
    "최근 다녀온 전시회나 공연이 있다면 소개해보세요",
    "다른 나라 문화 중 흥미롭게 느낀 점이 있나요?",
    "요즘 즐겨보는 예능이나 유튜브 콘텐츠는?",
    "기술 발전이 일상을 어떻게 바꾸고 있다고 생각하나요?"
  ];

  const STOCK_QUESTION = "오늘 주식시장의 시황을 말해보세요";

  const TRANSITION_MSGS = ["좋아요, 계속 가볼까요?","잘하고 있어요!","이 기세 그대로!","한 라운드 더!","리듬이 좋은데요?","순조롭게 가고 있어요"];

  /* ---------------- shuffle bag ---------------- */
  function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function makeBag(pool){
    let bag = shuffle(pool);
    return { next(){ if(bag.length===0) bag = shuffle(pool); return bag.pop(); } };
  }
  const bagKeywords = makeBag(KEYWORDS);
  const bagTopics = makeBag(TOPICS);
  const bagObjects = makeBag(OBJECTS);
  const bagQA = makeBag(QA_QUESTIONS);
  function pickKeywords(n){ const used=new Set(); const out=[]; while(out.length<n){ const w=bagKeywords.next(); if(!used.has(w)){used.add(w); out.push(w);} } return out; }

  /* ---------------- game config ---------------- */
  const GAMES = [
    { id:0, key:"keywords", accent:"--c1", icon:"🔗", title:"키워드 조합 스피치",
      subtitle:"3개의 단어를 연결해서 20초 스피치", fmt:"3라운드 · 20초",
      desc:"화면에 뜨는 단어 3개를 자유롭게 연결해서 20초간 이야기해보세요.", rounds:3, duration:20 },
    { id:1, key:"topic", accent:"--c2", icon:"💡", title:"주제 연상 단어",
      subtitle:"주제를 보고 관련 단어 3개 말하기", fmt:"3라운드 · 20초",
      desc:"제시된 주제를 보고 떠오르는 관련 단어 3개를 20초 안에 말해보세요.", rounds:3, duration:20 },
    { id:2, key:"word", accent:"--c3", icon:"📝", title:"단어 설명하기",
      subtitle:"제시된 단어를 20초간 설명", fmt:"3라운드 · 20초",
      desc:"화면의 단어를 다른 사람에게 설명하듯 20초간 풀어서 말해보세요.", rounds:3, duration:20 },
    { id:3, key:"stock", accent:"--c4", icon:"📈", title:"주식시황 브리핑",
      subtitle:"같은 내용을 60→30→15초로 압축", fmt:"1문제 · 60→30→15초",
      desc:"오늘 시황을 60초로 말한 뒤, 같은 내용을 30초, 15초로 점점 압축해보세요.", stages:[60,30,15] },
    { id:4, key:"qa", accent:"--c5", icon:"🎯", title:"랜덤 시사 질문",
      subtitle:"다양한 분야 질문에 즉석 답변", fmt:"3라운드 · 준비 3초 · 30초",
      desc:"시사·정치·국제·엔터·문화 질문에 3초간 생각한 뒤 30초간 답해보세요.", rounds:3, duration:30, prep:3 }
  ];

  /* ---------------- stats / storage ---------------- */
  function loadStats(){
    try { return JSON.parse(localStorage.getItem('speechstudio_stats')) || {totalSessions:0, streak:0, lastCompletedDate:null}; }
    catch(e){ return {totalSessions:0, streak:0, lastCompletedDate:null}; }
  }
  function saveStats(s){ try{ localStorage.setItem('speechstudio_stats', JSON.stringify(s)); }catch(e){} }
  function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
  function completeSession(gamesCount){
    const s = loadStats();
    const t = todayStr();
    if (s.lastCompletedDate !== t){
      const y = new Date(); y.setDate(y.getDate()-1); y.setHours(0,0,0,0);
      const yStr = y.toISOString().slice(0,10);
      s.streak = (s.lastCompletedDate === yStr) ? (s.streak||0)+1 : 1;
      s.lastCompletedDate = t;
    }
    s.totalSessions = (s.totalSessions||0)+1;
    saveStats(s);
    return s;
  }

  /* ---------------- audio ---------------- */
  let audioCtx = null;
  function ctx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
  function beep(freq, dur, type, vol){
    const c = ctx(); if(!c) return;
    try{
      const osc = c.createOscillator(); const gain = c.createGain();
      osc.type = type||'sine'; osc.frequency.value = freq;
      gain.gain.value = vol!=null?vol:0.16;
      osc.connect(gain); gain.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + (dur||0.12));
    }catch(e){}
  }
  const sndTick = ()=>beep(700,0.06,'sine',0.12);
  const sndStart = ()=>beep(880,0.14,'sine',0.18);
  const sndEnd = ()=>beep(440,0.28,'sine',0.2);

  /* ---------------- helpers ---------------- */
  const $ = id => document.getElementById(id);
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    $(id).classList.add('active');
  }
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  function setAccent(varName){ document.documentElement.style.setProperty('--accent', `var(${varName})`); }

  let aborted = false;
  let activeTimer = null;
  let currentFinish = null;

  /* ---------------- main menu ---------------- */
  function renderHome(){
    aborted = false;
    $('exitBtn').classList.remove('show');
    const s = loadStats();
    $('homeStats').innerHTML = (s.streak>0? `🔥 <b>${s.streak}</b>일째 연속&nbsp;&nbsp;·&nbsp;&nbsp;`:'') + `누적 <b>${s.totalSessions||0}</b>회`;
    const list = $('gameList');
    list.innerHTML = '';
    GAMES.forEach((g, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'game-btn';
      btn.style.setProperty('--accent', `var(${g.accent})`);
      btn.innerHTML = `<div class="icon">${g.icon}</div>
        <div class="meta"><div class="t">${g.title}</div><div class="s">${g.subtitle}</div></div>
        <div class="fmt">${g.fmt}</div>`;
      btn.onclick = ()=> startChain(idx);
      list.appendChild(btn);
    });
    showScreen('screen-home');
  }

  /* ---------------- chain runner ---------------- */
  async function startChain(fromIdx){
    ctx(); // unlock audio on user gesture
    aborted = false;
    $('exitBtn').classList.add('show');
    const queue = GAMES.slice(fromIdx);
    const played = [];
    for (let i=0; i<queue.length; i++){
      if (aborted) return;
      const game = queue[i];
      setAccent(game.accent);
      await playIntro(game, i===0);
      if (aborted) return;
      await playGame(game);
      played.push(game);
    }
    if (aborted) return;
    const stats = completeSession(played.length);
    renderComplete(played, stats);
  }

  function playIntro(game, isFirst){
    return new Promise(resolve=>{
      $('introEyebrow').textContent = isFirst ? '트레이닝 시작' : '다음 게임';
      $('introIcon').textContent = game.icon;
      $('introTitle').textContent = game.title;
      $('introDesc').textContent = game.desc;
      $('introFmt').textContent = game.fmt;
      showScreen('screen-intro');
      const bar = $('introProgressBar');
      bar.style.transition = 'none'; bar.style.width = '0%';
      requestAnimationFrame(()=>{
        bar.style.transition = 'width 1.9s linear';
        bar.style.width = '100%';
      });
      const t = setTimeout(()=>{ if(!aborted) resolve(); }, 1900);
      activeTimer = { cancel: ()=>{ clearTimeout(t); resolve(); } };
    });
  }

  async function playGame(game){
    if (game.key === 'stock'){
      const labels = [
        '먼저 60초 안에 편하게 말해보세요',
        '이번엔 같은 내용을 30초로 압축해보세요',
        '마지막으로 15초 안에 핵심만 말해보세요'
      ];
      for (let i=0;i<game.stages.length;i++){
        if (aborted) return;
        await runRound({
          game, roundIndex:i, roundTotal:game.stages.length,
          label: labels[i], promptText: STOCK_QUESTION, isWordChips:false,
          duration: game.stages[i], prep: 3
        });
        if (aborted) return;
        if (i < game.stages.length-1) await roundTransition(i+1, game.stages.length);
      }
      return;
    }
    for (let i=0;i<game.rounds;i++){
      if (aborted) return;
      let promptText='', isWordChips=false, label='';
      if (game.key==='keywords'){ promptText = pickKeywords(3); isWordChips=true; label='이 3단어를 사용해 20초간 말을 꺼내세요'; }
      else if (game.key==='topic'){ promptText = bagTopics.next(); label='이 주제로 20초간 관련 단어 3개를 꺼내세요'; }
      else if (game.key==='word'){ promptText = bagObjects.next(); label='이 단어를 20초간 설명하세요'; }
      else if (game.key==='qa'){ promptText = bagQA.next(); label='질문을 보고 생각한 뒤 30초간 답하세요'; }
      await runRound({
        game, roundIndex:i, roundTotal:game.rounds,
        label, promptText, isWordChips,
        duration: game.duration, prep: game.prep||3
      });
      if (aborted) return;
      if (i < game.rounds-1) await roundTransition(i+1, game.rounds);
    }
  }

  /* ---------------- round (prep + speak) ---------------- */
  function runRound({game, roundIndex, roundTotal, label, promptText, isWordChips, duration, prep}){
    return new Promise(resolve=>{
      // dots
      const dots = $('roundDots'); dots.innerHTML='';
      for(let i=0;i<roundTotal;i++){
        const d = document.createElement('span');
        if (i<roundIndex) d.classList.add('done');
        if (i===roundIndex) d.classList.add('now');
        dots.appendChild(d);
      }
      $('promptLabel').textContent = label;
      if (isWordChips){
        $('promptMain').className = 'prompt-main words';
        $('promptMain').innerHTML = promptText.map(w=>`<span class="chip">${w}</span>`).join('');
      } else {
        $('promptMain').className = 'prompt-main';
        $('promptMain').textContent = promptText;
      }
      showScreen('screen-round');

      const circumference = 2 * Math.PI * 88;
      const ring = $('ringFg');
      ring.style.strokeDasharray = `${circumference}`;
      const skipBtn = $('skipBtn');

      let settled = false;
      let phaseCtrl = null;

      function finish(){
        if (settled) return;
        settled = true;
        if (phaseCtrl) phaseCtrl.stop();
        skipBtn.onclick = null;
        currentFinish = null;
        resolve();
      }
      skipBtn.onclick = finish;
      currentFinish = finish;

      phaseCtrl = runPhase({ seconds: prep, mode:'prep', ring, circumference, onDone: ()=>{
        if (aborted || settled) return;
        phaseCtrl = runPhase({ seconds: duration, mode:'speak', ring, circumference, onDone: finish });
      }});
    });
  }

  // Returns a controller {stop()} that halts ticking without invoking onDone.
  function runPhase({seconds, mode, ring, circumference, onDone}){
    const isPrep = mode==='prep';
    $('statePill').innerHTML = isPrep
      ? `<span class="prep-pill">잠시 후 시작</span>`
      : `<span class="onair-pill"><span class="onair-dot"></span>말하는 중</span>`;
    $('timerSub').textContent = isPrep ? '준비하세요' : '';
    ring.style.stroke = isPrep ? 'var(--ring-bg)' : 'var(--accent)';
    ring.style.transition = 'none';
    ring.style.strokeDashoffset = '0';
    void ring.offsetWidth;

    const start = Date.now();
    const total = seconds*1000;
    if (isPrep) sndTick(); else sndStart();

    ring.style.transition = `stroke-dashoffset ${seconds}s linear`;
    requestAnimationFrame(()=>{ ring.style.strokeDashoffset = `${circumference}`; });

    let stopped = false;
    let timeoutId = null;
    let lastBeepSecond = null;

    function tick(){
      if (stopped) return;
      const elapsed = Date.now()-start;
      const remainMs = Math.max(0, total-elapsed);
      const remainSec = Math.ceil(remainMs/1000);
      $('timerNum').textContent = remainSec;
      if (!isPrep && remainSec<=3 && remainSec>0 && remainSec!==lastBeepSecond){ sndTick(); lastBeepSecond=remainSec; }
      if (remainMs<=0){
        stopped = true;
        if (!isPrep) sndEnd();
        onDone();
        return;
      }
      timeoutId = setTimeout(tick, 100);
    }
    tick();

    return { stop(){ stopped = true; if (timeoutId) clearTimeout(timeoutId); } };
  }

  function roundTransition(nextRoundNum, total){
    return new Promise(resolve=>{
      $('transitionMsg').textContent = TRANSITION_MSGS[Math.floor(Math.random()*TRANSITION_MSGS.length)];
      $('transitionSub').textContent = `다음: ${nextRoundNum+1} / ${total} 라운드`;
      showScreen('screen-transition');
      const t = setTimeout(()=>{ if(!aborted) resolve(); }, 1500);
      activeTimer = { cancel: ()=>{ clearTimeout(t); resolve(); } };
    });
  }

  /* ---------------- complete screen ---------------- */
  function renderComplete(played, stats){
    $('exitBtn').classList.remove('show');
    $('completeGames').innerHTML = played.map(g=>`<div class="g" style="background:color-mix(in srgb, var(${g.accent}) 22%, transparent)">${g.icon}</div>`).join('');
    $('completeStats').innerHTML = `
      <div class="complete-stat"><b>${played.length}</b><span>완료한 게임</span></div>
      <div class="complete-stat"><b>${stats.streak}</b><span>연속 일수</span></div>
      <div class="complete-stat"><b>${stats.totalSessions}</b><span>누적 트레이닝</span></div>`;
    showScreen('screen-complete');
  }
  $('homeBtn').onclick = renderHome;

  /* ---------------- exit ---------------- */
  $('exitBtn').onclick = ()=>{
    if (confirm('트레이닝을 종료할까요? 완료하지 않으면 이번 기록은 저장되지 않아요.')){
      aborted = true;
      if (activeTimer) activeTimer.cancel();
      if (currentFinish) currentFinish();
      renderHome();
    }
  };

  renderHome();
})();
</script>
